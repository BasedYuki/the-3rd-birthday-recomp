# The 3rd Birthday — North America (primary target)
# All game addresses for this release live here, never hardcoded in C.

[disc]
disc_id      = "ULUS10567"
title        = "The 3rd Birthday"
disc_version = "1.00"
app_ver      = "01.00"
psp_system_ver = "6.37"
iso_size     = 1467547648
iso_sha256   = "908b89f1dd4f1f521a17fa0cfc339f8390faa0b6da5bd54ff58a8150a4b24928"
iso_md5      = "47a7cb8e9e73d8aabef8139db7ee522b"

[eboot]
# /PSP_GAME/SYSDIR/EBOOT.BIN — encrypted, BOOT.BIN is an all-zero dummy
module_name    = "pe"
encrypted_size = 5664064
elf_size       = 5663725
psp_tag        = 0xD91613F0
# Decrypted with PPSSPP v1.20.4 "Dump decrypted EBOOT.BIN on game boot"
decrypted_elf_sha256 = "33cd4fa610d96c07b255ae58c17c78e3c0cd9cb84a415e8410bc6f7faa8451d9"
decrypted_size       = 5664064
elf_type             = 0xFFA0          # relocatable PRX, loaded at a base chosen by the kernel
entry                = 0x002F5774      # relative to load base
module_info_offset   = 0x0041605C      # file offset (first phdr p_paddr)

[assets]
archive = "/PSP_GAME/USRDIR/3rd.pkg"   # 1345484800 bytes, all game data
index   = "/PSP_GAME/USRDIR/3rd.fsd"   # 7932 bytes, presumably the pkg index

[functions]
# name = 0x08xxxxxx   (filled in from Ghidra as they are identified)
# camera_update =
# projection_setup =

[addresses]
# Emitted as ADDR_<NAME> into build/<game>/game_addrs.h by tools/toml_addrs.py.
# Global pointer to the gameplay camera (an orbit camera). Found 2026-09-27 by diffing RAM
# around scripted input (tools/ram_camdiff.py); stable across runs, the struct is on the heap.
camera_ptr        = 0x08C3C664
camera_eye_off    = 0x20   # vec3 eye position (derived)
camera_target_off = 0x30   # vec3 look-at target
camera_up_off     = 0x40   # vec3 up, (0,1,0) in gameplay
camera_pitch_off  = 0x50   # float radians (negative = looking down)
camera_yaw_off    = 0x54   # float radians
camera_dist_off   = 0x58   # float orbit distance
camera_fov_off    = 0x60   # float radians (0.6981 = 40 deg)
# A second camera object with the same layout starting 0x10 earlier (eye at +0x10): the one
# the rendered view follows (changing only the camera above moves the logic, not the picture).
viewcam_ptr       = 0x08C3C58C

[hooks]
# Functions whose entry calls sr_func_hook(s, addr) (codegen --hooks); emitted as HOOK_<NAME>.
# Camera: derives pitch/yaw/distance from eye (a0+0x10) and target (a0+0x20) of the render
# camera (a0 = *camera_ptr + 0x10); called from the camera setters at 0x08B20A44..0x08B20BF0.
camera_derive = 0x08B219DC
# Camera copy: copy(dst=a0, src=a1) of the camera fields from +0x10. The rendered view camera
# (viewcam_ptr) is filled this way from another camera object every frame.
camera_copy   = 0x08B20774
